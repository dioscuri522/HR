name: verify-standfm

# 取得経路が実際に機能するかを確認する。
# メタデータの集計値をログに出すだけで、何もコミットしない。

on:
  push:
    branches: [claude/okuda-core-thinking-qp8c80]
    paths:
      - "scripts/fetch_episodes.py"
      - ".github/workflows/verify-standfm.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/okuda-core-thinking-qp8c80
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: エピソード一覧の取得を検証
        env:
          STANDFM_CHANNEL_ID: 5f5edcc0f04555115dfb0845
        run: python scripts/fetch_episodes.py
